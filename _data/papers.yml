  - title: "Disaster Risk and Wealth Inequality"
    coauthors:
      - "Alexander Dietrich, Danmarks Nationalbank"
      - "Gernot Müller, University of Tuebingen"
    abstract: "Rich households derive a large part of their income from productive capital, which is at risk of large devaluations in a disaster event. Using a survey-based randomized controlled trial (RCT), we show that rich households increase their saving rate in response to higher disaster risk, while poorer households show a weakly negative response. Next, we quantify the impact on inequality of aggregate disaster risk using an incomplete markets model disciplined by our RCT evidence. Regressions on local exposure to natural disasters and on international variation in GDP tail risk support the model prediction that disaster risk increases wealth inequality."
    presentations: "Danmarks Nationalbank Research Seminar (2024), VfS (2025), ifo Conference on Macroeconomics and Survey Data (2025), EWMES (2025), EAYE (2026), T2M (2026), NASM (2026), BSE Summer Forum (2026)"
    links:
        - name: "PDF"
          url: "/WorkingPapers/DisasterRiskWealthInequality102026.pdf"
 
  - title: "Local Methods for Large Transfers"
    coauthors:
    - "Christian Bayer, University of Bonn"
    - "Luigi-Maria Briglia, University of Tuebingen"
    - "Ralph Luetticke, University of Tuebingen"
    - "Yannik Winkelmann, University of Tuebingen"
    abstract: "Large fiscal transfers shift households between regions with high and low marginal propensities to consume (MPCs), resulting in nonlinear aggregate responses. We develop a Nonlinear DEGM Update (NDU) method that shifts the wealth distribution nonlinearly over a short time window while solving the aggregate economy using a fast, first-order state-space approximation. A 10 percent transfer of annual GDP increases output by 4.5 percent in the nonlinear and NDU solutions, but by 12.0 percent in the linear solution. The empirical liquid-wealth distribution around zero disciplines this nonlinearity and exhibits a strong asymmetry. A stochastic debt-entry cost closely reproduces this empirical pattern."
    journal_status: "submitted"
    presentations: "EWMES (2026, scheduled)"
