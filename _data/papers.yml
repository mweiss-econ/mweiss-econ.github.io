  - title: "Fundamental Stock Price Cycles"
    abstract: "News shocks about higher future capital returns can explain stock price booms and subsequent busts in a two-asset, heterogeneous agent New Keynesian model. The key mechanism is a time-varying, predictable illiquidity premium, which endogenously arises from the optimal portfolio choice of capital-wealthy households in response to anticipated investment opportunities. The model accounts for two thirds of stock market ﬂuctuations, the majority of which is orthogonal to future aggregate dividend growth. Observed wealth-portfolios of capital-wealthy households from U.S. survey data during stock price boom-bust cycles are qualitatively in line with the portfolio liquidity channel."
    presentations: "YES (Yale, 2022), MMF (2023), HeiTueHo (2024), EWMES (2024)"
    links:
